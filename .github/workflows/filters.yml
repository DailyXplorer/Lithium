# The filter set is built from lists that change every day, and a clean clone builds it before
# anything else. This builds it once a week, so a list that outgrows WebKit's rule limit is
# noticed here, and not by the next person who clones the repository.
name: Filter lists

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the filter set from today's lists
        run: python3 scripts/update-filters.py
